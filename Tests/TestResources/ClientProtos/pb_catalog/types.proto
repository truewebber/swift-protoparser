    INFORMATIONAL = 1;
    NAVIGATIONAL = 2;
    TRANSACTIONAL = 4;
    COMMERCIAL = 8;
}

message IntentSet {
    repeated INTENT intents = 1;
}
*/

message Targeting {
    string location = 1;
    string country_code = 2;
    string device = 3;
    string language = 4;
    string search_engine = 5;
    string engine = 6;
}

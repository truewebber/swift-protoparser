// Minimal stub of buf/validate/validate.proto for SwiftProtoParser integration tests.
// Only the types and extensions actually used by the gateway protos are declared here.
syntax = "proto3";

package buf.validate;

import "google/protobuf/descriptor.proto";

// FieldConstraints holds validation rules for a single field.
message FieldConstraints {
  FloatRules float = 1;
  DoubleRules double = 2;
  Int32Rules int32 = 3;
  Int64Rules int64 = 4;
  UInt32Rules uint32 = 5;
  UInt64Rules uint64 = 6;
  StringRules string = 25;
}

message FloatRules {
  optional float gt = 4;
  optional float lt = 6;
}

message DoubleRules {
  optional double gt = 4;
  optional double lt = 6;
}

message Int32Rules {
  optional int32 gt = 4;
  optional int32 lt = 6;
}

message Int64Rules {
  optional int64 gt = 4;
  optional int64 lt = 6;
}

message UInt32Rules {
  optional uint32 gt = 4;
  optional uint32 lt = 6;
}

message UInt64Rules {
  optional uint64 gt = 4;
  optional uint64 lt = 6;
}

message StringRules {
  optional uint64 min_len = 2;
  optional uint64 max_len = 3;
  optional string pattern = 4;
}

extend google.protobuf.FieldOptions {
  FieldConstraints field = 1159;
}

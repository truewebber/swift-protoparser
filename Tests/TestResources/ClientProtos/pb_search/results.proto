syntax = "proto3";

package acme.library.search.v2;

import "pb_analytics/common.proto";
import "pb_catalog/types.proto";

option go_package = "github.com/acme/library/proto/pb_search";

// Request message for Results call
message ResultsRequest {
    // User ID
    int32 user_id = 1;

    // Collection ID (`{collection}` or `{collection}_{target}` format)
    string collection_id = 2;

    // Type of items the report is calculated for
    acme.library.catalog.REPORT_TYPE type = 3;

    // Start date for the analysis period (`YYYYMMDD` format)
    string date_begin = 4;

    // End date for the analysis period (`YYYYMMDD` format)
    string date_end = 5;

    // Main competitor mask
    string main_competitor = 6;

    // Volume level filter for the report calculation
    acme.library.catalog.VOLUME_TYPE volume_level = 7;

    // Sorting criteria
    acme.library.catalog.Sort sort = 8;

    // Pagination parameters
    acme.library.analytics.LimitOffset limit_offset = 9;

    // List of competitors to compare against
    repeated acme.library.catalog.Competitor competitors = 10;

    // Filter by string expression
    repeated acme.library.catalog.StringExpr filter_expression = 11;
}

// Response message for Results call
message ResultsResponse {
    // Total number of matching results
    uint64 total = 1;

    // Result rows as serialized data
    repeated string rows = 2;

    // Top counters summary
    acme.library.analytics.TopCounter top_counter = 3;
}

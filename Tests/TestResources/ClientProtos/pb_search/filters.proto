syntax = "proto3";

package acme.library.search.v2;

import "pb_catalog/types.proto";

option go_package = "github.com/acme/library/proto/pb_search";

// Request message for Filters call
message FiltersRequest {
    // User ID
    int32 user_id = 1;

    // Collection ID (`{collection}` or `{collection}_{target}` format)
    string collection_id = 2;

    // Type of items the report is calculated for
    acme.library.catalog.REPORT_TYPE type = 3;

    // Start date for the analysis period (`YYYYMMDD` format)
    string date_begin = 4;

    // End date for the analysis period (`YYYYMMDD` format)
    string date_end = 5;

    // Specific competitor to focus on
    string competitor = 6;

    // Volume level filter
    acme.library.catalog.VOLUME_TYPE volume_level = 7;

    // Sorting criteria
    acme.library.catalog.Sort sort = 8;
}

// Response message for Filters call
message FiltersResponse {
    // Available volume types
    repeated string available_volume_types = 1;

    // Filter tags
    repeated string tags = 2;
}
